<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haydn Sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1020; color: #e5e7eb; font-family: system-ui, sans-serif; overflow: hidden; }
      #app { position: fixed; inset: 0; }
      #canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #hud { position: fixed; top: 12px; left: 12px; padding: 8px 12px; background: rgba(0,0,0,0.4); border-radius: 6px; font-size: 13px; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="canvas"></canvas>
    </div>
    <div id="hud">haydn sandbox — drag the panels</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
